image: ghcr.io/cirruslabs/flutter:3.27.0

stages:
  - validate
  - build
  - deploy

variables:
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .pub-cache/

before_script:
  - flutter --version
  - flutter config --enable-web
  - flutter pub get

analyze:
  stage: validate
  script:
    - flutter analyze

build_web:
  stage: build
  script:
    - flutter build web --release --base-href /
  artifacts:
    expire_in: 1 week
    paths:
      - build/web/

pages:
  stage: deploy
  script:
    - rm -rf public
    - mv build/web public
  artifacts:
    paths:
      - public
  only:
    - main
