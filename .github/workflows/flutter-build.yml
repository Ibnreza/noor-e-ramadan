name: Flutter Build and Deploy

on:
  push:
    branches:
      - main  # or whichever branch you want to trigger the build on
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
    
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.27.0'  # Specify the Flutter version you want to use
    
    - name: Install dependencies
      run: |
        flutter pub get

    - name: Run build_runner (for code generation)
      run: |
        flutter pub run build_runner build --delete-conflicting-outputs

    - name: Build Flutter web
      run: |
        flutter build web --release

    - name: Deploy to GitHub Pages (or your deployment target)
      run: |
        # Commands to deploy to GitHub Pages (if you use it)
        # For example, this deploys the `build/web` folder to GitHub Pages
        git config --global user.name "Your Name"
        git config --global user.email "your-email@example.com"
        git remote set-url origin https://github.com/${{ github.repository }}
        git add -A
        git commit -m "Deploy Flutter app"
        git push origin main
