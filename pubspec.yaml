name: ramadan_app
description: "Noor Ramadan - The #1 Islamic App for 2026. Offline-first, privacy-focused Ramadan companion for Bangladesh."
publish_to: 'none'
version: 2.0.0+2026

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Local Storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  
  # Prayer Times Calculation
  adhan: ^2.1.2
  
  # Qibla Direction
  flutter_qiblah: ^3.2.0
  
  # Charts
  fl_chart: ^0.70.0
  
  # Location Services
  geolocator: ^13.0.2
  
  # Local Notifications
  flutter_local_notifications: ^18.0.1
  
  # Haptic Feedback
  vibration: ^3.1.2
  
  # Confetti Animation
  confetti: ^0.8.0
  
  # Internationalization & Formatting
  intl: ^0.19.0
  
  # Google Fonts
  google_fonts: ^6.2.1
  
  # Animations
  flutter_animate: ^4.5.2
  
  # Sensors (for Qibla)
  sensors_plus: ^6.1.1
  
  # Permission Handler
  permission_handler: ^11.3.1
  
  # Path Provider
  path_provider: ^2.1.5
  
  # Share Plus (for shareable cards)
  share_plus: ^10.1.3
  
  # Screenshot (for shareable cards)
  screenshot: ^3.0.0
  
  # Device Info
  device_info_plus: ^11.2.0
  
  # Package Info
  package_info_plus: ^8.1.2
  
  # URL Launcher
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  hive_generator: ^2.0.1
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
  generate: true
  
  assets:
    - assets/images/
    - assets/animations/
    - assets/fonts/
  
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
        - asset: assets/fonts/Amiri-Italic.ttf
          style: italic
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_intl:
  enabled: true
  class_name: AppLocalizations
  main_locale: en
  arb_dir: lib/localization
  output_dir: lib/localization/generated
