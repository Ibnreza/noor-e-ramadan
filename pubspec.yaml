name: ramadan_app
description: "Noor Ramadan - The #1 Islamic App for 2026."
publish_to: 'none'
version: 2.0.0+2026

environment:
  sdk: '>=3.6.0 <4.0.0'
  # Lowering this slightly ensures it works on more environments
  flutter: '>=3.27.0' 
  
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  
  # Change this to 'any' temporarily to force a resolution
  adhan: any 
  
  flutter_qiblah: ^3.2.0
  fl_chart: ^0.70.0
  geolocator: ^13.0.2
  flutter_local_notifications: ^18.0.1
  vibration: ^3.1.2
  confetti: ^0.8.0
  
  # Ensure intl is compatible with the latest Flutter
  intl: any 
  
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  sensors_plus: ^6.1.1
  permission_handler: ^11.3.1
  path_provider: ^2.1.5
  share_plus: ^10.1.3
  screenshot: ^3.0.0
  device_info_plus: ^11.2.0
  package_info_plus: ^8.1.2
  url_launcher: ^6.3.1
